<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#2563eb';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.18);
  ctx.fill();

  // Text "印"
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${s * 0.55}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('印', s / 2, s / 2 + s * 0.02);
}

function download(canvas, filename) {
  drawIcon(canvas);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = filename;
  a.click();
}

download(document.getElementById('c192'), 'icon-192.png');
download(document.getElementById('c512'), 'icon-512.png');
</script>
<p>Icons downloaded! Place them in the public/ directory.</p>
</body>
</html>
